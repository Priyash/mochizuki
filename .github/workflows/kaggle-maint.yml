# Owner-run maintenance on the Kaggle account (Actions > kaggle-maint > Run workflow).
name: kaggle-maint
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [status, delete-stuck-worker, delete-queued-probe]
concurrency:
  group: state-branch            # the producer and Kaggle maintenance never overlap
  cancel-in-progress: false
jobs:
  maint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "kaggle>=1.7" six
      - name: Which notebooks (the film's worker and probe, by the names the engine gives them)
        run: |
          echo "WORKER=$(python -m engine where kaggle-worker)" >> "$GITHUB_ENV"
          echo "PROBE=$(python -m engine where kaggle-probe)" >> "$GITHUB_ENV"
          user="$(python -m engine where kaggle-worker | cut -d/ -f1)"
          film="$(basename "$(python -m engine where)")"
          echo "TEST_CPU=$user/$film-test-cpu" >> "$GITHUB_ENV"        # made by kaggle-test
      - name: Run
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          set +e
          kaggle kernels list --mine
          kaggle kernels status "$WORKER"
          kaggle kernels status "$PROBE"
          if [ "$ACTION" = "delete-queued-probe" ]; then
            if kaggle kernels status "$PROBE" | grep -qi queued; then
              kaggle kernels delete "$PROBE" -y && echo "probe deleted (it was queued)"
            else
              echo "probe is not queued; left alone"
            fi
          fi
          if [ "$ACTION" = "delete-stuck-worker" ]; then
            kaggle kernels delete "$WORKER" -y
            kaggle kernels delete "$TEST_CPU" -y
            sleep 5
            kaggle kernels list --mine
          fi
          kaggle quota -v
