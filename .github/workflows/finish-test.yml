# One shot's AI finish on a Kaggle T4, outside the ledger (engine/providers/kaggle/finish_test.py):
#   render  the shot's voice, then the shot and its guide passes (depth, lines) with Blender on this runner
#   finish  the inputs go to the release finish-tests; a Kaggle notebook paints one finish per guide; each
#           finish comes back beside its guide and the 3D render, with a middle frame beside its stills
# Uses Kaggle GPU time: the 1.3B check (ai_finish) about an hour, the 14B at 720p (ai_finish_720) longer.
# Never touches the ledger or the state branch.
name: finish-test
on:
  workflow_dispatch:
    inputs:
      shot:
        description: "Shot"
        default: "1-05"
      engine:
        description: "Finish engine: ai_finish (Wan VACE 1.3B, 832x480) or ai_finish_720 (14B, 1280x720)"
        default: "ai_finish"
      controls:
        description: "Guides to finish from, one finish each"
        default: "depth,lines"
      size:
        description: "Render size of the shot and its guides"
        default: "1280x720"
      minutes:
        description: "The Kaggle notebook's time limit, minutes"
        default: "180"
concurrency:
  group: finish-test              # one Kaggle test at a time: Kaggle runs at most two GPU sessions
  cancel-in-progress: false
permissions:
  contents: write                 # the release finish-tests
env:
  FILM: ${{ vars.FILM }}          # the film (blank: the only one in films/)
  SHOT: ${{ inputs.shot }}
  SIZE: ${{ inputs.size }}
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: state
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.13
      - name: Which film
        run: |
          echo "CGI=$(python -m engine where cgi)" >> "$GITHUB_ENV"
          echo "LEDGER=$(python -m engine where ledger)" >> "$GITHUB_ENV"
      - name: Tools, software OpenGL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 \
            libgbm1 libxkbcommon0 libsm6 libxi6 libxxf86vm1 libxfixes3 libxrender1
      - name: The shot's render and guides from an earlier test (the same shot, size and sheets)
        id: render-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CGI }}/${{ inputs.shot }}/${{ inputs.shot }}.mp4
            ${{ env.CGI }}/${{ inputs.shot }}/${{ inputs.shot }}.depth.mp4
            ${{ env.CGI }}/${{ inputs.shot }}/${{ inputs.shot }}.lines.mp4
          key: finish-test-render-${{ inputs.shot }}-${{ inputs.size }}-${{ inputs.controls }}-${{ hashFiles('films/*/style_bible/*.json', 'films/*/shots.csv', 'films/*/config.json', 'engine/cgi/**', 'engine/audio/**') }}
      - name: Kokoro (CPU, Python 3.12) for the shot's voice
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          python3.12 -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python3.12 -m pip install -q -r engine/audio/tts/requirements.txt
          python3.12 -c "import os, sys, unidic; sys.exit(0 if os.path.exists(os.path.join(unidic.DICDIR, 'mecabrc')) else 1)" \
            || python3.12 -m unidic download
      - name: Voiced lines and the Kokoro model (the 3D workflow's cache)
        if: steps.render-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ${{ env.CGI }}/voices
          key: cgi-voices-${{ hashFiles('films/*/style_bible/dialogue.json', 'engine/audio/voice.py', 'engine/audio/tts/*') }}
          restore-keys: cgi-voices-
      - name: Voice the shot
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: python -m engine cgi voices "$SHOT" --python "$(which python3.12)"
      - name: Blender (bpy, Python 3.13), Kaggle and the review tools
        run: |
          pip install -q -r engine/cgi/render/blender/requirements.txt pillow "kaggle>=1.7" six
          python -c "import bpy; print('bpy', bpy.app.version_string)"
      - name: Render the shot and its guides
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          export BLENDER="$(which python)"
          python -m engine cgi render "$SHOT" --size "$SIZE" --guides "${{ inputs.controls }}"
          ls -la "$CGI/$SHOT"
      - name: The ledger (read here only, to find the chosen stills if they are not approved yet)
        run: if [ -f "state/$(basename "$LEDGER")" ]; then cp "state/$(basename "$LEDGER")" "$LEDGER"; fi
      - name: Finish on Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          kaggle kernels list --mine || true
          python -m engine finish-test "$SHOT" --engine "${{ inputs.engine }}" --controls "${{ inputs.controls }}" \
            --minutes "${{ inputs.minutes }}" --work finish-work --chosen-refs | tee finish-test.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### AI finish test: ${{ inputs.shot }}, ${{ inputs.engine }}"
            echo
            echo '```'
            sed -n '/^{/,$p' finish-test.txt 2>/dev/null | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: finish-test
          path: |
            finish-work/*/*.mp4
            finish-work/*/*.png
            finish-work/*/*.json
            finish-work/*/out/
            finish-work/*/kernel/
            ${{ env.CGI }}/${{ inputs.shot }}/*.mp4
          if-no-files-found: ignore
          retention-days: 7
