# Every 10 minutes: start the producer at once if a RunPod batch has finished (its pod bills
# while it waits), or if RunPod was waiting for a GPU and one is now in stock within the agreed
# price. The producer re-checks price, cap and balance before renting. Writes nothing.
name: runpod-watch
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: state
          path: state
      - name: Is a RunPod batch done?
        id: poll
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          [ -n "$RUNPOD_API_KEY" ] && [ -f state/ledger.sqlite ] || { echo "nothing to watch"; exit 0; }
          cp state/ledger.sqlite ledger.sqlite
          if python -m pipeline runpod-poll --state state; then echo "done=1" >> "$GITHUB_OUTPUT"; fi
      - name: Start the producer
        if: steps.poll.outputs.done == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/produce.yml/dispatches" -f ref=main
