# Test RunPod end to end with one tiny batch: create a pod, run, download, delete the pod.
# stub: plumbing only, no GPU model (about $0.03). gpu: one short real Wan clip (about $0.10-0.20).
name: runpod-smoke
on:
  workflow_dispatch:
    inputs:
      engine_set:
        description: "stub (plumbing only) or gpu (one real short clip)"
        required: true
        default: stub
        type: choice
        options: [stub, gpu]
      model:
        description: "Video engine for the gpu test"
        required: false
        default: "Wan 2.2 5B"
        type: choice
        options: ["Wan 2.2 5B", "Wan 2.2 14B"]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run one tiny batch on RunPod
        env:
          GH_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m pipeline runpod-smoke --engine-set "${{ inputs.engine_set }}" --model "${{ inputs.model }}" --out smoke/clip.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runpod-smoke-clip
          path: smoke/
          if-no-files-found: ignore
